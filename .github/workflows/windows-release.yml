# Airdour — Windows MSVC release (win64 only)
#
# Triggers:
#   - push tags matching v* (e.g. v0.1.0)
#   - manual workflow_dispatch (builds a draft/prerelease zip)
#
# Publishes a staged zip: WASAPI I/O smoke lib + sources + BUILD_STATUS.
# Full GUI / hardour installer is intentionally not claimed yet.

name: Windows MSVC Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win64 release zip
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } else {
            $short = "${{ github.sha }}".Substring(0, 7)
            $v = "ci-$short"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure cmake/win64
        run: |
          cmake -S cmake/win64 -B build-win64 `
            -G "Visual Studio 17 2022" -A x64 `
            -DAIRDOUR_BUILD_WASAPI_IO_SMOKE=ON
        shell: pwsh

      - name: Build wasapi_io_smoke
        run: cmake --build build-win64 --config Release --target wasapi_io_smoke -j $env:NUMBER_OF_PROCESSORS
        shell: pwsh

      - name: Package release zip
        id: pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = & .\tools\win-native\ci\Package-Release.ps1 `
            -RepoRoot (Get-Location) `
            -OutDir (Join-Path (Get-Location) "dist") `
            -Version "${{ steps.ver.outputs.version }}" `
            -BuildDir (Join-Path (Get-Location) "build-win64") `
            -GitSha "${{ github.sha }}" `
            -GitRef "${{ github.ref }}"
          echo "zip=$zip" >> $env:GITHUB_OUTPUT
          Get-Content (Join-Path dist stage BUILD_STATUS.txt) -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - name: Upload release artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: airdour-${{ steps.ver.outputs.version }}-win64-ci
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Airdour ${{ steps.ver.outputs.version }} (win64 CI)
          draft: false
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            ## Airdour Windows CI release (`${{ steps.ver.outputs.version }}`)

            **Audio path:** WASAPI shared only (no ASIO / DirectSound / exclusive).

            ### Artifact contents
            Staged `airdour-*-win64-ci.zip`:
            - `bin/airdour_wasapi_io.lib` — MSVC smoke build of WasapiIO (Windows SDK)
            - `src/backends/wasapi/` — shared-mode backend sources
            - `cmake/win64/` — MSVC spine
            - `BUILD_STATUS.txt` — green vs blocked checklist

            ### Not included yet
            - Full `hardour` / `gtk2_ardour` binaries (MSVC GLib/GTK2 dep prefix pending)
            - Installer (NSIS/MSIX)

            See `tools/win-native/README.md` and `BUILD_STATUS.txt` inside the zip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

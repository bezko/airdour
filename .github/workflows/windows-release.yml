# Airdour — Windows MSVC release (win64 only)
#
# Triggers:
#   - push tags matching v* (e.g. v0.1.0)
#   - manual workflow_dispatch (builds a draft/prerelease zip)
#
# Publishes a functional win64 release from windows-2022:
#   1) airdour-*-win64-shell.zip — portable engine shell (Dummy + WASAPI + LV2)
#   2) airdour-*-win64-setup.exe — NSIS installer of that engine stage (per-user)
#   3) airdour-*-win64-ci.zip — WASAPI sources + BUILD_STATUS
#   4) airdour-*-win64-installer-src.zip — airdour.nsi + packaging scripts
#
# The job builds vcpkg, the waf Release engine, and the CMake engine shell,
# then smokes the packaged tree with --backend Dummy.
# Tags containing test/rc/alpha/beta/pre are published as GitHub prereleases.

name: Windows MSVC Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release-win64:
    name: Build and publish win64 release zip
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}"
          } else {
            $short = "${{ github.sha }}".Substring(0, 7)
            $v = "ci-$short"
          }
          $pre = "false"
          if ($v -match '(?i)(^|[.-])(test|rc|alpha|beta|pre|dev)([.-]|$)') { $pre = "true" }
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.prerelease }}" -eq "true") {
            $pre = "true"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "prerelease=$pre" >> $env:GITHUB_OUTPUT
          Write-Host "version=$v prerelease=$pre"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: tools/win-native/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('tools/win-native/vcpkg.json', 'tools/win-native/vcpkg-configuration.json', 'tools/win-native/overlays/**') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install headless deps (vcpkg manifest + overlays)
        shell: pwsh
        run: |
          .\tools\win-native\Install-HeadlessDeps.ps1 -VcpkgRoot C:\vcpkg
          if ($LASTEXITCODE -ne 0) { throw "Install-HeadlessDeps failed: $LASTEXITCODE" }

      # Waf discovers MSVC via its own vcvarsall probe. Do not preload
      # ilammy/msvc-dev-cmd first — that balloons PATH and the probe exits 255.
      - name: Configure waf engine (Release, MSVC)
        shell: cmd
        run: tools\win-native\configure-waf-release.cmd build-rel

      - name: Build waf engine
        shell: cmd
        run: tools\win-native\build-waf-release.cmd build-rel

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure engine shell (preset)
        shell: pwsh
        working-directory: cmake/win64
        run: cmake --preset engine

      - name: Build engine shell
        shell: pwsh
        working-directory: cmake/win64
        run: cmake --build --preset engine

      - name: Run CTest smoke suite
        shell: pwsh
        working-directory: cmake/win64
        run: ctest --preset engine --output-on-failure

      - name: Install NSIS
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
              throw "choco install nsis failed (exit $LASTEXITCODE)"
            }
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $found) { throw "makensis.exe not found after NSIS install" }
          $dir = Split-Path $found -Parent
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & $found -VERSION
          Write-Host "makensis=$found"

      - name: Package release zips + NSIS installer
        id: pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $shell = Get-ChildItem -Path build-ninja-engine -Recurse -Filter "airdour_win_shell.exe" | Select-Object -First 1
          if (-not $shell) { throw "airdour_win_shell.exe not found" }
          $wafLibs = Join-Path (Get-Location) "build-rel\libs"
          $vcpkg = Join-Path (Get-Location) "tools\win-native\vcpkg_installed\x64-windows"
          & .\tools\win-native\ci\Package-Release.ps1 `
            -RepoRoot (Get-Location) `
            -OutDir (Join-Path (Get-Location) "dist") `
            -Version "${{ steps.ver.outputs.version }}" `
            -BuildDir (Join-Path (Get-Location) "build-ninja-engine") `
            -ShellExe $shell.FullName `
            -WafLibsDir $wafLibs `
            -VcpkgInstalled $vcpkg `
            -Mode Engine `
            -Config Release `
            -GitSha "${{ github.sha }}" `
            -GitRef "${{ github.ref }}" `
            -BootstrapNsis
          Get-ChildItem dist -Filter "*.zip" | ForEach-Object {
            Write-Host "ZIP $($_.Name) ($([int]($_.Length/1KB)) KB)"
          }
          Get-ChildItem dist -Filter "*.exe" | ForEach-Object {
            Write-Host "EXE $($_.Name) ($([int]($_.Length/1KB)) KB)"
          }
          Get-Content (Join-Path dist stage BUILD_STATUS.txt) -ErrorAction SilentlyContinue
          $shellZip = Get-ChildItem dist -Filter "airdour-*-win64-shell.zip" | Select-Object -First 1
          if (-not $shellZip) { throw "Engine zip airdour-*-win64-shell.zip was not produced" }
          echo "shell_zip=$($shellZip.FullName)" >> $env:GITHUB_OUTPUT
          $setup = Get-ChildItem dist -Filter "airdour-*-win64-setup.exe" |
            Where-Object { $_.Name -notlike "*-setup-ui.exe" } |
            Select-Object -First 1
          if (-not $setup) { throw "Engine setup.exe was not produced" }
          echo "setup_exe=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          echo "has_setup=true" >> $env:GITHUB_OUTPUT

      - name: Smoke packaged engine (Dummy backend)
        shell: pwsh
        run: |
          $stage = Join-Path (Get-Location) "dist\shell-stage"
          foreach ($rel in @(
            "ardour.dll",
            "backends\wasapi\wasapi_audiobackend.dll",
            "backends\dummy\dummy_audiobackend.dll"
          )) {
            if (-not (Test-Path (Join-Path $stage $rel))) { throw "Staged package missing $rel" }
          }
          Push-Location $stage
          try {
            cmd.exe /c "run-airdour.bat --timeout 3 --backend Dummy"
            if ($LASTEXITCODE -ne 0) { throw "Packaged Dummy smoke exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Smoke engine installer (silent per-user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "airdour-*-win64-setup.exe" |
            Where-Object { $_.Name -notlike "*-setup-ui.exe" } |
            Select-Object -First 1
          if (-not $setup) { throw "setup exe missing" }
          # NSIS /D= must be the last argument and must not be quoted. Keep this path space-free.
          $inst = "C:\AirdourCiSmoke"
          if (Test-Path $inst) { Remove-Item $inst -Recurse -Force }
          $cmd = '"{0}" /S /D={1}' -f $setup.FullName, $inst
          Write-Host "install: $cmd"
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Silent install exit $LASTEXITCODE" }
          foreach ($rel in @(
            "run-airdour.bat",
            "airdour_win_shell.exe",
            "ardour.dll",
            "backends\wasapi\wasapi_audiobackend.dll",
            "backends\dummy\dummy_audiobackend.dll",
            "Uninstall.exe",
            "COPYING"
          )) {
            $p = Join-Path $inst $rel
            if (-not (Test-Path $p)) { throw "Missing $p after install" }
          }
          Push-Location $inst
          try {
            cmd.exe /c "run-airdour.bat --timeout 3 --backend Dummy"
            if ($LASTEXITCODE -ne 0) { throw "Installed Dummy smoke exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          $unins = Join-Path $inst "Uninstall.exe"
          # _?= keeps uninstall in this process so cmd waits until files are gone.
          # It must be the last argument and must not be quoted.
          cmd.exe /c "`"$unins`" /S _?=$inst"
          if ($LASTEXITCODE -ne 0) { throw "Silent uninstall exit $LASTEXITCODE" }
          if (Test-Path (Join-Path $inst "airdour_win_shell.exe")) {
            throw "Uninstall left airdour_win_shell.exe in $inst"
          }

      - name: Upload release artifacts (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: airdour-${{ steps.ver.outputs.version }}-win64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      - name: Collect release file list
        id: files
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $paths = @()
          Get-ChildItem dist -Filter "*.zip" -ErrorAction SilentlyContinue | ForEach-Object { $paths += $_.FullName }
          Get-ChildItem dist -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $paths += $_.FullName }
          if ($paths.Count -eq 0) { throw "No dist zip/exe to publish" }
          # Multiline output for softprops/action-gh-release
          $joined = $paths -join "`n"
          echo "list<<EOF" >> $env:GITHUB_OUTPUT
          echo $joined >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $($paths.Count) file(s):"
          $paths | ForEach-Object { Write-Host "  $_" }

      - name: Publish GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Airdour ${{ steps.ver.outputs.version }} (win64)
          draft: false
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.files.outputs.list }}
          body: |
            ## Airdour Windows release (`${{ steps.ver.outputs.version }}`)

            **Brand:** Airdour · **GUI:** Win32 + Direct2D/DirectWrite (no GTK2)
            **Audio path:** WASAPI shared (Dummy backend included). No ASIO / DirectSound.

            Unzip `airdour-*-win64-shell.zip` and run `run-airdour.bat`, or install:

            ```bat
            airdour-*-win64-setup.exe /S /D=C:\Airdour
            Uninstall.exe /S _?=C:\Airdour
            ```

            The `/D=` path is last and is not quoted.

            ### Artifacts
            - `airdour-*-win64-shell.zip` — portable engine shell: `libardour`, Dummy, WASAPI, bundled LV2, vcpkg DLLs
            - `airdour-*-win64-setup.exe` — NSIS per-user installer of that same tree
            - `airdour-*-win64-ci.zip` — WASAPI sources + BUILD_STATUS
            - `airdour-*-win64-installer-src.zip` — `airdour.nsi` + packaging scripts

            CI smokes this package with `run-airdour.bat --timeout 3 --backend Dummy`.

            ### Not included
            - Code-signed installer
            - GTK plugin UIs
            - The optional x86 VST2 bridge helper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

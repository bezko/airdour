# Airdour — Windows MSVC CI (win64 only)
#
# Product path: AIRDOUR_WINDOWS_ONLY / WASAPI shared.
# This job compiles the WasapiIO smoke library (Windows SDK only) and
# configures the cmake/win64 spine.

name: Windows MSVC CI

on:
  push:
    branches:
      - master
      - main
      - "cursor/**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: windows-msvc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: clang-format (changed win_ardour files)
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check formatting
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          if (-not $base) { $base = "${{ github.event.before }}" }
          if (-not $base -or $base -match '^0+$') {
            .\tools\win-native\ci\Format-Check.ps1
          } else {
            .\tools\win-native\ci\Format-Check.ps1 -BaseRef $base
          }

  wasapi-smoke:
    name: WASAPI I/O smoke (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure (preset ui)
        run: cmake --preset ui
        shell: pwsh
        working-directory: cmake/win64

      - name: "Build (preset ui: wasapi_io_smoke + airdour_win_shell)"
        run: cmake --build --preset ui
        shell: pwsh
        working-directory: cmake/win64

      - name: Run CTest smoke suite
        run: ctest --preset ui
        shell: pwsh
        working-directory: cmake/win64

      - name: Smoke airdour_win_shell (--timeout 2 --no-engine)
        run: |
          $exe = Get-ChildItem -Path build-ninja-ui -Recurse -Filter "airdour_win_shell.exe" | Select-Object -First 1
          if (-not $exe) { throw "airdour_win_shell.exe not found" }
          & $exe.FullName --timeout 2 --no-engine
          if ($LASTEXITCODE -ne 0) { throw "win_shell smoke exit $LASTEXITCODE" }
        shell: pwsh

      - name: Write BUILD_STATUS
        run: |
          $lib = Get-ChildItem -Path build-ninja-ui -Recurse -Filter "airdour_wasapi_io.lib" | Select-Object -First 1
          $gui = Get-ChildItem -Path build-ninja-ui -Recurse -Filter "airdour_win_shell.exe" | Select-Object -First 1
          .\tools\win-native\ci\Write-BuildStatus.ps1 `
            -OutFile build-ninja-ui\BUILD_STATUS.txt `
            -GitSha "${{ github.sha }}" `
            -GitRef "${{ github.ref }}" `
            -WasapiSmokePath $(if ($lib) { $lib.FullName } else { "" }) `
            -WinShellPath $(if ($gui) { $gui.FullName } else { "" })
          Get-Content build-ninja-ui\BUILD_STATUS.txt
        shell: pwsh

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airdour-win64-ci-${{ github.sha }}
          path: |
            build-ninja-ui/**/airdour_wasapi_io.lib
            build-ninja-ui/**/airdour_win_shell.exe
            build-ninja-ui/BUILD_STATUS.txt
            libs/backends/wasapi/**
            win_ardour/**
            cmake/win64/**
            tools/win-native/**
          if-no-files-found: error
          retention-days: 14
